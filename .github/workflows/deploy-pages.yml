name: Deploy to GitHub Pages

# Combines three independent projects into one GitHub Pages site:
#   /       -> the trip-planner React app (claude/travel-route-planner-poi-xs399b)
#   /tv     -> the Israeli TV multi-view page (claude/philadelphia-attractions-site-2xdu49;
#              the branch name is historical - it used to hold a Philadelphia guide, and
#              is kept because it is already allowed to deploy to the github-pages environment)
#   /lomda  -> the BI portal interactive learning module (claude/lomda-portal-bi-rt3nh4)
# This file must be kept identical on all three branches so a push to any one
# rebuilds and redeploys the combined site.

on:
  push:
    branches:
      - claude/travel-route-planner-poi-xs399b
      - claude/philadelphia-attractions-site-2xdu49
      - claude/lomda-portal-bi-rt3nh4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trip planner app
        uses: actions/checkout@v4
        with:
          ref: claude/travel-route-planner-poi-xs399b
          path: app

      - name: Checkout BI portal lomda
        uses: actions/checkout@v4
        with:
          ref: claude/lomda-portal-bi-rt3nh4
          path: lomda-site

      - name: Checkout Israeli TV multi-view
        uses: actions/checkout@v4
        with:
          ref: claude/philadelphia-attractions-site-2xdu49
          path: tv-site

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build trip planner app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Assemble combined site
        run: |
          mkdir -p combined
          cp -r app/dist/. combined/
          mkdir -p combined/lomda
          cp -r lomda-site/lomda/. combined/lomda/
          mkdir -p combined/tv
          cp -r tv-site/tv/. combined/tv/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./combined

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
