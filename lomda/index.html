<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לומדת פורטל BI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;800&family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#13235B; --accent:#2E5FDC; --accent-ink:#FFFFFF;
  --paper:#F5F8FE; --surface:#FFFFFF; --mist:#EAF1FC; --mist-2:#EEF3FD;
  --border:#DBE4F6; --slate:#57607A; --slate-2:#8891AB;
  --success:#1B8F63; --success-bg:#E6F6EE; --success-border:#A9DFC4;
  --danger:#C9432F; --danger-bg:#FCEAE7; --danger-border:#F0B7AC;
  --amber-bg:#FFF6E5; --amber-border:#F0C36B;
  --shadow: 0 10px 30px -14px rgba(19,35,91,0.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7ECFB; --accent:#7C9EFF; --accent-ink:#0B1224;
    --paper:#0A1020; --surface:#121A31; --mist:#182446; --mist-2:#152040;
    --border:#26325A; --slate:#A7B0CC; --slate-2:#7B84A3;
    --success:#57D9A3; --success-bg:#0F2A22; --success-border:#1F5A44;
    --danger:#FF8A76; --danger-bg:#301613; --danger-border:#6B2A22;
    --amber-bg:#2A2110; --amber-border:#6E5320;
    --shadow: 0 10px 30px -14px rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"]{
  --ink:#E7ECFB; --accent:#7C9EFF; --accent-ink:#0B1224;
  --paper:#0A1020; --surface:#121A31; --mist:#182446; --mist-2:#152040;
  --border:#26325A; --slate:#A7B0CC; --slate-2:#7B84A3;
  --success:#57D9A3; --success-bg:#0F2A22; --success-border:#1F5A44;
  --danger:#FF8A76; --danger-bg:#301613; --danger-border:#6B2A22;
  --amber-bg:#2A2110; --amber-border:#6E5320;
  --shadow: 0 10px 30px -14px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  direction:rtl; background:var(--paper); color:var(--ink);
  font-family:'Heebo',system-ui,sans-serif; min-height:100%;
}
h1,h2,h3,.display{ font-family:'Frank Ruhl Libre', Georgia, serif; text-wrap:balance; }
button{ font-family:inherit; }
::selection{ background:var(--accent); color:var(--accent-ink); }
a{ color:var(--accent); }

.app{ max-width:1180px; margin:0 auto; padding:0 20px; padding-block:0; }

/* ---------- header ---------- */
.topbar{
  background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20;
}
.topbar-inner{
  max-width:1180px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:14px;
}
.brandmark{ display:flex; align-items:center; gap:10px; }
.brandmark img{ height:34px; border-radius:6px; }
.brand-text{ display:flex; flex-direction:column; line-height:1.2; }
.brand-text b{ font-size:16px; font-weight:800; }
.brand-text span{ font-size:12px; color:var(--slate); }
.topbar-progress{ margin-inline-start:auto; display:flex; align-items:center; gap:10px; min-width:0; }
.progress-track{ width:140px; height:8px; border-radius:99px; background:var(--mist); overflow:hidden; }
.progress-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .4s ease; }
.progress-label{ font-size:13px; color:var(--slate); white-space:nowrap; font-variant-numeric:tabular-nums; }
.reset-link{ font-size:12px; color:var(--slate-2); background:none; border:none; cursor:pointer; text-decoration:underline; padding:4px; }

/* ---------- layout ---------- */
.layout{ display:grid; grid-template-columns: 300px 1fr; gap:28px; padding-block:28px; align-items:start; }
@media (max-width:860px){ .layout{ grid-template-columns:1fr; } }

.rail{ position:sticky; top:78px; display:flex; flex-direction:column; gap:8px; }
@media (max-width:860px){
  .rail{ position:static; flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  .rail::-webkit-scrollbar{ height:6px; }
}
.rail-item{
  display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px;
  background:var(--surface); border:1px solid var(--border); cursor:pointer;
  text-align:right; font-size:14px; color:var(--ink); transition:background .15s, border-color .15s;
  flex:none; width:100%;
}
@media (max-width:860px){ .rail-item{ width:auto; white-space:nowrap; } }
.rail-item:hover{ border-color:var(--accent); }
.rail-item.active{ background:var(--mist); border-color:var(--accent); }
.rail-num{
  width:26px; height:26px; border-radius:50%; background:var(--mist); color:var(--slate);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none;
  font-variant-numeric:tabular-nums;
}
.rail-item.done .rail-num{ background:var(--success); color:#fff; }
.rail-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- stage ---------- */
.stage{ min-width:0; }

.welcome{
  background:var(--surface); border:1px solid var(--border); border-radius:20px;
  padding:40px clamp(20px,4vw,52px); box-shadow:var(--shadow);
}
.welcome h1{ font-size:clamp(26px,3.4vw,38px); margin:0 0 12px; color:var(--ink); }
.welcome p.lead{ font-size:17px; color:var(--slate); max-width:62ch; line-height:1.7; margin:0 0 28px; }
.how-steps{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:8px; }
@media (max-width:700px){ .how-steps{ grid-template-columns:1fr; } }
.how-step{ background:var(--mist); border-radius:14px; padding:18px; }
.how-step b{ display:block; font-size:14px; margin-bottom:6px; color:var(--ink); }
.how-step span{ font-size:13.5px; color:var(--slate); line-height:1.55; }
.start-btn{
  margin-top:26px; background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px;
  padding:14px 26px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:var(--shadow);
}
.start-btn:hover{ filter:brightness(1.05); }

.unit-card{
  background:var(--surface); border:1px solid var(--border); border-radius:20px;
  padding:clamp(20px,3.4vw,44px); box-shadow:var(--shadow);
}
.unit-kicker{ font-size:12.5px; letter-spacing:.06em; color:var(--accent); font-weight:700; margin-bottom:6px; }
.unit-title{ font-size:clamp(22px,3vw,30px); margin:0 0 22px; }

.block-p{ font-size:16.5px; line-height:1.85; color:var(--ink); margin:0 0 18px; max-width:68ch; }
.block-h{ font-size:19px; font-weight:700; color:var(--ink); margin:26px 0 12px; }
.block-bullets{ list-style:none; margin:0 0 18px; padding:0; display:flex; flex-direction:column; gap:12px; }
.block-bullets li{ display:flex; gap:10px; font-size:15.5px; line-height:1.7; color:var(--ink); }
.block-bullets li::before{ content:"●"; color:var(--accent); font-size:10px; margin-top:8px; flex:none; }
.block-bullets b{ color:var(--ink); }
.block-bullets .rest{ color:var(--slate); }

.block-note{ border-radius:14px; border:1px solid var(--border); padding:16px 20px; margin:0 0 18px; }
.block-note.amber{ background:var(--amber-bg); border-color:var(--amber-border); }
.block-note:not(.amber){ background:var(--mist); }
.note-title{ display:flex; align-items:center; gap:8px; font-weight:700; margin-bottom:8px; }
.note-line{ font-size:14.5px; line-height:1.7; color:var(--ink); margin:0 0 4px; }

.block-img{ margin:0 0 22px; }
.block-img figure{ margin:0; }
.block-img img{ max-width:100%; border-radius:12px; border:1px solid var(--border); display:block; margin:0 auto; box-shadow:var(--shadow); }
.block-img figcaption{ text-align:center; font-size:13px; color:var(--slate-2); margin-top:10px; font-style:italic; }

.to-practice{
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px;
  padding:15px 20px; font-size:16px; font-weight:700; cursor:pointer; width:100%; margin-top:8px;
}
.to-practice:hover{ filter:brightness(1.05); }

/* ---------- practice ---------- */
.practice{ margin-top:30px; padding-top:30px; border-top:2px dashed var(--border); }
.practice-eyebrow{ font-size:12.5px; letter-spacing:.06em; color:var(--slate-2); font-weight:700; margin-bottom:8px; }
.practice-q{ font-size:19px; font-weight:700; margin:0 0 18px; }

.quiz-options{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
.quiz-opt{
  text-align:right; padding:14px 16px; border-radius:12px; border:1.5px solid var(--border);
  background:var(--surface); color:var(--ink); font-size:15px; cursor:pointer; transition:all .12s;
}
.quiz-opt:hover:not(:disabled){ border-color:var(--accent); }
.quiz-opt.correct{ background:var(--success-bg); border-color:var(--success-border); color:var(--success); font-weight:700; }
.quiz-opt.wrong{ background:var(--danger-bg); border-color:var(--danger-border); color:var(--danger); animation:shake .3s; }
.quiz-opt:disabled{ cursor:default; }

.feedback{ border-radius:12px; padding:14px 18px; font-size:14.5px; line-height:1.65; margin-bottom:16px; display:none; }
.feedback.show{ display:block; }
.feedback.good{ background:var(--success-bg); border:1px solid var(--success-border); color:var(--ink); }
.feedback.bad{ background:var(--amber-bg); border:1px solid var(--amber-border); color:var(--ink); }

.hotspot-wrap{
  position:relative; display:inline-block; max-width:100%; border-radius:14px; overflow:hidden;
  border:1px solid var(--border); box-shadow:var(--shadow); background:#fff; cursor:crosshair;
}
.hotspot-wrap img{ display:block; max-width:100%; height:auto; }
.hotspot-target{ position:absolute; }
.hotspot-hint{
  position:absolute; border:2px dashed var(--accent); border-radius:10px; pointer-events:none;
  animation:pulse 1.1s infinite; opacity:0;
}
.hotspot-hint.show{ opacity:1; }
.hotspot-mark{
  position:absolute; border-radius:10px; pointer-events:none; opacity:0;
  border:2.5px solid var(--success); background:rgba(27,143,99,.14);
}
.hotspot-mark.show{ opacity:1; }
@keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(46,95,220,.35);} 70%{ box-shadow:0 0 0 12px rgba(46,95,220,0);} 100%{box-shadow:0 0 0 0 rgba(46,95,220,0);} }
@keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(6px);} 75%{transform:translateX(-6px);} }

.unit-nav{ display:flex; justify-content:space-between; gap:10px; margin-top:26px; }
.ghost-btn{
  background:none; border:1.5px solid var(--border); color:var(--ink); border-radius:12px;
  padding:12px 20px; font-size:14.5px; cursor:pointer;
}
.ghost-btn:hover{ border-color:var(--accent); }
.primary-btn{
  background:var(--success); color:#fff; border:none; border-radius:12px;
  padding:12px 22px; font-size:14.5px; font-weight:700; cursor:pointer;
}
.done-badge{ display:none; align-items:center; gap:8px; background:var(--success-bg); border:1px solid var(--success-border); color:var(--success); border-radius:99px; padding:8px 16px; font-size:13.5px; font-weight:700; margin-bottom:18px; }
.done-badge.show{ display:inline-flex; }
[hidden]{ display:none !important; }
</style>
</head>

const STORE_KEY = "bi-lomda-progress-v1";

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch(e){ return {}; }
}
function saveProgress(p){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch(e){}
}
let progress = loadProgress();
let currentUnit = null;

function completedCount(){ return UNITS.filter(u => progress[u.id]).length; }

function renderTopProgress(){
  const done = completedCount(), total = UNITS.length;
  document.getElementById("progressLabel").textContent = done + "/" + total + " הושלמו";
  document.getElementById("progressFill").style.width = (done/total*100) + "%";
}

function renderRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  UNITS.forEach(u => {
    const el = document.createElement("button");
    el.className = "rail-item" + (progress[u.id] ? " done" : "") + (currentUnit === u.id ? " active" : "");
    el.innerHTML = '<span class="rail-num">' + (progress[u.id] ? "✓" : u.id) + '</span><span class="rail-title">' + u.title + '</span>';
    el.onclick = () => openUnit(u.id);
    rail.appendChild(el);
  });
}

function blockHTML(b){
  if (b.t === "p") return '<p class="block-p">' + b.v + '</p>';
  if (b.t === "h") return '<div class="block-h">' + b.v + '</div>';
  if (b.t === "bullets") {
    const items = b.v.map(it => Array.isArray(it)
      ? '<li><span><b>' + it[0] + '</b> — <span class="rest">' + it[1] + '</span></span></li>'
      : '<li><span class="rest">' + it + '</span></li>').join("");
    return '<ul class="block-bullets">' + items + '</ul>';
  }
  if (b.t === "note") {
    const lines = b.v.map(l => '<div class="note-line">' + l + '</div>').join("");
    return '<div class="block-note' + (b.amber ? ' amber' : '') + '"><div class="note-title">' + (b.icon ? '<span>' + b.icon + '</span>' : '') + '<span>' + b.title + '</span></div>' + lines + '</div>';
  }
  if (b.t === "img") {
    const style = b.w ? ' style="max-width:' + b.w + 'px"' : '';
    return '<div class="block-img"><figure><img src="' + IMAGES[b.src] + '"' + style + ' alt=""/><figcaption>' + b.cap + '</figcaption></figure></div>';
  }
  return "";
}

function renderWelcome(){
  currentUnit = null;
  renderRail();
  const stage = document.getElementById("stage");
  stage.innerHTML = `
    <div class="welcome">
      <h1>ברוכים הבאים ללומדת פורטל ה-BI</h1>
      <p class="lead">לומדה קצרה בת 9 יחידות שתלווה אתכם צעד-צעד בפורטל ה-BI של פלטפורמת הדאטה. בכל יחידה: הסבר קצר, ואז תרגול אינטראקטיבי על גבי מסכי המערכת האמיתיים.</p>
      <div class="how-steps">
        <div class="how-step"><b>1. קוראים</b><span>הסבר קצר וממוקד על הנושא של היחידה, עם דוגמאות מתוך הפורטל עצמו.</span></div>
        <div class="how-step"><b>2. מתרגלים</b><span>משימה אינטראקטיבית — ללחוץ על האייקון הנכון במסך, או לענות על שאלה.</span></div>
        <div class="how-step"><b>3. ממשיכים</b><span>ההתקדמות נשמרת אצלכם בדפדפן, כך שאפשר לעצור ולחזור בכל שלב.</span></div>
      </div>
      <button class="start-btn" id="startBtn">בואו נתחיל ›</button>
    </div>
  `;
  document.getElementById("startBtn").onclick = () => openUnit(UNITS[0].id);
}

function openUnit(id){
  currentUnit = id;
  const u = UNITS.find(x => x.id === id);
  renderRail();
  const stage = document.getElementById("stage");
  const idx = UNITS.findIndex(x => x.id === id);
  const prevId = idx > 0 ? UNITS[idx-1].id : null;
  const nextId = idx < UNITS.length-1 ? UNITS[idx+1].id : null;

  stage.innerHTML = `
    <div class="unit-card">
      <div class="unit-kicker">${u.kicker}</div>
      <h2 class="unit-title">${u.title}</h2>
      <div class="done-badge" id="doneBadge">✓ יחידה זו הושלמה</div>
      <div id="explainBlocks">${u.explain.map(blockHTML).join("")}</div>
      <button class="to-practice" id="toPractice">המשך לתרגול ›</button>
      <div class="practice" id="practiceZone" hidden></div>
      <div class="unit-nav">
        <button class="ghost-btn" id="prevBtn" ${prevId ? "" : "disabled"}>‹ היחידה הקודמת</button>
        <button class="ghost-btn" id="menuBtn">לתפריט היחידות</button>
        <button class="ghost-btn" id="nextBtn" ${nextId ? "" : "disabled"}>היחידה הבאה ›</button>
      </div>
    </div>
  `;

  if (progress[id]) document.getElementById("doneBadge").classList.add("show");

  document.getElementById("toPractice").onclick = () => {
    document.getElementById("toPractice").hidden = true;
    const zone = document.getElementById("practiceZone");
    zone.hidden = false;
    renderPractice(zone, u);
    zone.scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
  document.getElementById("menuBtn").onclick = renderWelcome;
  if (prevId) document.getElementById("prevBtn").onclick = () => openUnit(prevId);
  if (nextId) document.getElementById("nextBtn").onclick = () => openUnit(nextId);

  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function markComplete(unitId){
  progress[unitId] = true;
  saveProgress(progress);
  renderTopProgress();
  renderRail();
  const badge = document.getElementById("doneBadge");
  if (badge) badge.classList.add("show");
}

function renderPractice(zone, u){
  const p = u.practice;
  if (p.type === "quiz") {
    zone.innerHTML = `
      <div class="practice-eyebrow">תרגול</div>
      <div class="practice-q">${p.q}</div>
      <div class="quiz-options" id="quizOpts"></div>
      <div class="feedback" id="quizFeedback"></div>
    `;
    const opts = document.getElementById("quizOpts");
    p.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "quiz-opt";
      btn.textContent = opt;
      btn.onclick = () => {
        const fb = document.getElementById("quizFeedback");
        if (i === p.correct) {
          btn.classList.add("correct");
          Array.from(opts.children).forEach(c => c.disabled = true);
          fb.className = "feedback good show";
          fb.textContent = "✓ נכון! " + p.explain;
          markComplete(u.id);
        } else {
          btn.classList.add("wrong");
          fb.className = "feedback bad show";
          fb.textContent = "לא בדיוק — נסו שוב.";
          setTimeout(() => btn.classList.remove("wrong"), 350);
        }
      };
      opts.appendChild(btn);
    });
  } else if (p.type === "hotspot") {
    zone.innerHTML = `
      <div class="practice-eyebrow">תרגול</div>
      <div class="practice-q">${p.instruction}</div>
      <div class="hotspot-wrap" id="hsWrap">
        <img src="${IMAGES[p.image]}" alt="" draggable="false"/>
        <div class="hotspot-hint" id="hsHint"></div>
        <div class="hotspot-mark" id="hsMark"></div>
      </div>
      <div class="feedback" id="hsFeedback"></div>
    `;
    const wrap = document.getElementById("hsWrap");
    const hint = document.getElementById("hsHint");
    const mark = document.getElementById("hsMark");
    const fb = document.getElementById("hsFeedback");
    const box = p.box;
    [hint, mark].forEach(el => {
      el.style.left = box.left + "%";
      el.style.top = box.top + "%";
      el.style.width = box.width + "%";
      el.style.height = box.height + "%";
    });
    let attempts = 0;
    let solved = false;
    wrap.addEventListener("click", (e) => {
      if (solved) return;
      const rect = wrap.getBoundingClientRect();
      const xPct = (e.clientX - rect.left) / rect.width * 100;
      const yPct = (e.clientY - rect.top) / rect.height * 100;
      const inBox = xPct >= box.left && xPct <= box.left + box.width && yPct >= box.top && yPct <= box.top + box.height;
      if (inBox) {
        solved = true;
        mark.classList.add("show");
        fb.className = "feedback good show";
        fb.textContent = "✓ " + p.success;
        markComplete(u.id);
      } else {
        attempts++;
        fb.className = "feedback bad show";
        fb.textContent = attempts >= 2 ? "רמז: האזור המסומן בעיגול המקווקו הוא המקום הנכון." : "לא בדיוק שם — נסו שוב.";
        if (attempts >= 2) hint.classList.add("show");
      }
    });
  }
}

document.getElementById("resetBtn").onclick = () => {
  if (confirm("לאפס את כל ההתקדמות בלומדה?")) {
    progress = {};
    saveProgress(progress);
    renderTopProgress();
    renderWelcome();
  }
};

renderTopProgress();
renderWelcome();
</script>
